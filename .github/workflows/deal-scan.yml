name: YVR Deal Scanner

on:
  schedule:
    # Runs once a week, Monday 14:00 UTC (~7am Pacific). Edit the cron to taste.
    - cron: '0 14 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run scanner
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ROUTES_SHEET_CSV_URL: ${{ secrets.ROUTES_SHEET_CSV_URL }}
        run: python scan_deals.py

      - name: Commit updated data file
        run: |
          git config user.name "yvr-deal-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/deals.json
          git diff --quiet --cached || git commit -m "Update deal data"
          git push
